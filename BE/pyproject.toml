[project]
name = "northstar-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_demo.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-q"
pythonpath = ["."]
