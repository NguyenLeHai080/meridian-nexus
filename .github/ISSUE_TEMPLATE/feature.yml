name: Feature
description: Propose a scoped product or engineering feature
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or business problem should be solved?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and permission impact
      description: Describe authentication, authorization, data, and abuse considerations.
    validations:
      required: true
