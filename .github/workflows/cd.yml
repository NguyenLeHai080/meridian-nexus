name: CD

on:
  push:
    branches: [staging, prod]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: BE
          target: production
          push: true
          tags: |
            ghcr.io/nguyenlehai080/meridian-nexus-api:${{ github.ref_name }}
            ghcr.io/nguyenlehai080/meridian-nexus-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        if: vars.VITE_API_URL != '' && vars.VITE_BACKEND_URL != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - name: Build frontend
        if: vars.VITE_API_URL != '' && vars.VITE_BACKEND_URL != ''
        working-directory: FE
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        if: vars.VITE_API_URL != '' && vars.VITE_BACKEND_URL != ''
        with:
          name: meridian-nexus-web-${{ github.sha }}
          path: FE/dist
          if-no-files-found: error
          retention-days: 30
      - name: Report deferred frontend publication
        if: vars.VITE_API_URL == '' || vars.VITE_BACKEND_URL == ''
        run: |
          echo "Frontend publication is deferred until VITE_API_URL and VITE_BACKEND_URL are configured in the ${{ github.ref_name }} environment." >> "$GITHUB_STEP_SUMMARY"
