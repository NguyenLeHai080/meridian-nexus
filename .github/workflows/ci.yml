name: Enterprise CI

on:
  pull_request:
    branches: [dev, staging, prod]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read
  issues: read
  pull-requests: read
  security-events: write

concurrency:
  group: enterprise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  VITE_API_URL: http://127.0.0.1:8000/api/v1
  VITE_BACKEND_URL: http://127.0.0.1:8000
  VITE_APP_NAME: Meridian Nexus

jobs:
  governance:
    name: PR governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test pull request governance rules
        run: python .github/scripts/test_validate_pull_request.py
      - name: Validate issue, branch, title, and Definition of Done
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python .github/scripts/validate_pull_request.py
      - name: Record protected branch push
        if: github.event_name == 'push'
        run: echo "Protected branch push accepted after pull request governance."

  backend-static:
    name: Backend static quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            BE/requirements.txt
            BE/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff format --check northstar tests_python scripts
      - run: ruff check northstar tests_python scripts

  backend-contract:
    name: Backend contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            BE/requirements.txt
            BE/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: >-
          pytest
          tests_python/test_api.py
          tests_python/test_auth_recovery.py
          tests_python/test_scale_and_ownership.py

  backend-adversarial:
    name: Backend adversarial tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            BE/requirements.txt
            BE/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: pytest tests_python/test_adversarial.py

  backend-integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: northstar_ci
          POSTGRES_PASSWORD: northstar_ci
          POSTGRES_USER: northstar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U northstar_ci -d northstar_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: BE
    env:
      APP_ENV: local
      APP_KEY: integration-key-that-is-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://northstar_ci:northstar_ci@127.0.0.1:5432/northstar_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      FRONTEND_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BE/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Start API with production dependencies
        run: |
          python -m uvicorn northstar.main:app --host 127.0.0.1 --port 8000 --no-server-header &
          echo $! > /tmp/northstar-api.pid
      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: python scripts/security_smoke.py --target http://127.0.0.1:8000

  frontend-static:
    name: Frontend static quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  frontend-e2e:
    name: Frontend browser E2E
    needs: [backend-static, frontend-static]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    env:
      E2E_BACKEND_COMMAND: python -m uvicorn northstar.main:app --host 127.0.0.1 --port 8010 --no-server-header
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BE/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: python -m pip install --requirement ../BE/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  frontend-build:
    name: Frontend production build
    needs: [frontend-static, frontend-unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run build

  dependency-audit:
    name: Dependency and license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: BE/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: python -m pip install --requirement BE/requirements-dev.txt
      - run: pip-audit --requirement BE/requirements.txt
      - run: npm ci
        working-directory: FE
      - run: npm audit --audit-level=high
        working-directory: FE
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  sast:
    name: SAST (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@bb16b9baa2ec4010b29f5c606d57d01190139edd # v4.37.1

  container-security:
    name: Container security gate
    needs: [backend-static, backend-contract, backend-adversarial, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: BE
          target: production
          load: true
          tags: meridian-nexus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: meridian-nexus-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: FE
          load: true
          tags: meridian-nexus-web:ci
          build-args: |
            VITE_API_URL=/api/v1
            VITE_BACKEND_URL=/
            VITE_APP_NAME=Meridian Nexus
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: meridian-nexus-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  release-gate:
    name: Enterprise release gate
    if: always()
    needs:
      - governance
      - backend-static
      - backend-contract
      - backend-adversarial
      - backend-integration
      - frontend-static
      - frontend-unit
      - frontend-e2e
      - frontend-build
      - dependency-audit
      - sast
      - container-security
    runs-on: ubuntu-latest
    env:
      GOVERNANCE: ${{ needs.governance.result }}
      BACKEND_STATIC: ${{ needs.backend-static.result }}
      BACKEND_CONTRACT: ${{ needs.backend-contract.result }}
      BACKEND_ADVERSARIAL: ${{ needs.backend-adversarial.result }}
      BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
      FRONTEND_STATIC: ${{ needs.frontend-static.result }}
      FRONTEND_UNIT: ${{ needs.frontend-unit.result }}
      FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
      FRONTEND_BUILD: ${{ needs.frontend-build.result }}
      DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
      SAST: ${{ needs.sast.result }}
      CONTAINER_SECURITY: ${{ needs.container-security.result }}
    steps:
      - name: Enforce every delivery gate
        shell: bash
        run: |
          results=(
            "$GOVERNANCE"
            "$BACKEND_STATIC"
            "$BACKEND_CONTRACT"
            "$BACKEND_ADVERSARIAL"
            "$BACKEND_INTEGRATION"
            "$FRONTEND_STATIC"
            "$FRONTEND_UNIT"
            "$FRONTEND_E2E"
            "$FRONTEND_BUILD"
            "$DEPENDENCY_AUDIT"
            "$SAST"
            "$CONTAINER_SECURITY"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one enterprise delivery gate did not pass: ${results[*]}"
              exit 1
            fi
          done
          echo "All enterprise delivery gates passed." >> "$GITHUB_STEP_SUMMARY"
