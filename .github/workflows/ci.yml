name: CI

on:
  pull_request:
    branches: [dev, staging, prod]
  push:
    branches: [dev, staging, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate pull request title
        shell: bash
        run: |
          pattern='^(feat|fix|refactor|docs|chore|style|perf|vendor|test|ci|build|security)(\([a-z0-9._/-]+\))?!?: .+ #[0-9]+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must follow: type(scope): description #issue_id"
            exit 1
          fi

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            BE/requirements.txt
            BE/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff format --check northstar tests_python scripts
      - run: ruff check northstar tests_python scripts
      - run: pytest
      - run: pip-audit --requirement requirements.txt

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://127.0.0.1:8000/api/v1
      VITE_BACKEND_URL: http://127.0.0.1:8000
      VITE_APP_NAME: Meridian Nexus
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm audit --audit-level=high

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: BE
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
